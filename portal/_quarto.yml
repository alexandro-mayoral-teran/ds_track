project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - sesion.qmd
    - leccion.qmd
    - lab.qmd
    - bitacora.qmd
    - fuentes.qmd
    - contenido.qmd
    - modulo-00.qmd
    - registro.qmd
    - "00-*.qmd"
  resources:
    - descargas/**
    - procedencia.json
    - portal.js
website:
  title: DS Track
  search: false
  sidebar:
    style: docked
    background: "#f1f3f0"
    title: "DS Track <span class='brand-dot'>●</span>"
    subtitle: "APRENDER EN COMPAÑÍA"
    contents:
      - text: "Portada"
        href: index.qmd
      - text: "Contenido del curso"
        href: contenido.qmd
      - section: "00 · ENTORNO DE APRENDIZAJE"
        contents:
          - text: "Presentación del módulo"
            href: modulo-00.qmd
          - text: "00.01 · Markdown y perfil"
            href: 00-01-leccion.qmd
          - text: "00.02 · Terminal y rutas"
            href: 00-02-leccion.qmd
          - text: "00.03 · Git e historial"
            href: 00-03-leccion.qmd
          - text: "00.04 · Primer script"
            href: 00-04-leccion.qmd
          - text: "00.05 · Entornos"
            href: 00-05-leccion.qmd
          - text: "00.06 · Primer notebook"
            href: 00-06-leccion.qmd
          - text: "Comprobación y evidencia"
            href: registro.qmd
      - section: "SESIÓN 02.01"
        contents:
          - text: "Tu recorrido"
            href: sesion.qmd
          - text: "01 · Comprender"
            href: leccion.qmd
          - text: "02 · Practicar"
            href: lab.qmd
          - text: "03 · Registrar y explicar"
            href: bitacora.qmd
      - text: "Material de consulta"
        href: fuentes.qmd
  page-footer:
    left: "DS Track · Aprendizaje acompañado"
    right: "Leer → practicar → comprobar → explicar"
lang: es
format:
  html:
    theme: default
    mainfont: "system-ui, -apple-system, Segoe UI, sans-serif"
    css: estilos.css
    toc: true
    toc-title: En esta página
    code-copy: true
    include-after-body: scripts.html
execute:
  enabled: false
  eval: false
  freeze: false
